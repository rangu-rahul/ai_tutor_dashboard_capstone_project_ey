{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Project - Smart AI Tutor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            color: #667eea;
            font-size: 1.5rem;
        }

        .btn-game {
            background: #667eea;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-game:hover {
            transform: translateY(-2px);
        }

        .upload-card {
            background: white;
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .page-title {
            text-align: center;
            color: #2d3748;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #667eea;
        }

        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            background: #f7fafc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #ebf4ff;
        }

        .upload-icon {
            font-size: 3rem;
            color: #a0aec0;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #4a5568;
            font-weight: 500;
        }

        .upload-subtext {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            .upload-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>🚀 Upload Project</h1>
            </div>
            <div>
                <a href="{% url 's_home' %}" class="btn-game">Dashboard</a>
            </div>
        </header>

        <div class="upload-card">
            <h2 class="page-title">Submit Your Work</h2>
            <form action="#" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Select Course</label>
                    <select class="form-select">
                        <option>Web Development</option>
                        <option>Data Structures</option>
                        <option>Database Management</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Project Title</label>
                    <input type="text" class="form-input" placeholder="e.g., Personal Portfolio Website">
                </div>

                <div class="form-group">
                    <label class="form-label">Description / Remarks</label>
                    <textarea class="form-textarea" rows="4"
                        placeholder="Briefly describe your project or add any notes..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Project Files</label>
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">☁️</div>
                        <div class="upload-text">Click to upload or drag and drop</div>
                        <div class="upload-subtext">ZIP, PDF, or Docx options (Max 50MB)</div>
                        <input type="file" id="fileInput" style="display: none;" multiple>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Submit Project</button>
            </form>
        </div>
    </div>
</body>

</html>
